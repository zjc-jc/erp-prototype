<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的 - 进销存系统</title>
    <link rel="stylesheet" href="css/mobile.css">
    <style>
        .user-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 32px 20px;
            margin: -72px -12px 20px;
            padding-top: 92px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .user-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        .user-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .user-role {
            font-size: 13px;
            opacity: 0.9;
        }
        .menu-section {
            background: white;
            border-radius: 12px;
            margin-bottom: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .menu-item {
            display: flex;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #f5f5f5;
            text-decoration: none;
            color: inherit;
        }
        .menu-item:last-child {
            border-bottom: none;
        }
        .menu-item:active {
            background: #f5f7fa;
        }
        .menu-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-right: 12px;
        }
        .menu-text {
            flex: 1;
            font-size: 15px;
        }
        .menu-arrow {
            color: #ccc;
            font-size: 14px;
        }
        .menu-badge {
            background: #f44336;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="header-left">
            <span class="header-title">我的</span>
        </div>
        <div class="header-right">
            <div class="header-icon">⚙️</div>
        </div>
    </header>

    <!-- 主内容 -->
    <main class="main-content">
        <!-- 用户信息头部 -->
        <div class="user-header">
            <div class="user-info">
                <div class="user-avatar">👤</div>
                <div>
                    <div class="user-name">张小明</div>
                    <div class="user-role">仓库管理员</div>
                </div>
            </div>
        </div>

        <!-- 统计数据 -->
        <div class="stats-grid" style="margin-bottom: 16px;">
            <div class="stat-card">
                <div class="stat-value" style="font-size: 20px;">128</div>
                <div class="stat-label">本月操作</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="font-size: 20px;">56</div>
                <div class="stat-label">待处理</div>
            </div>
        </div>

        <!-- 常用功能 -->
        <div class="menu-section">
            <div class="menu-item">
                <div class="menu-icon" style="background: #e3f2fd;">📋</div>
                <span class="menu-text">我的申请</span>
                <span class="menu-badge">3</span>
                <span class="menu-arrow">›</span>
            </div>
            <div class="menu-item">
                <div class="menu-icon" style="background: #fff3e0;">✅</div>
                <span class="menu-text">我的审批</span>
                <span class="menu-badge">5</span>
                <span class="menu-arrow">›</span>
            </div>
            <div class="menu-item">
                <div class="menu-icon" style="background: #e8f5e9;">📝</div>
                <span class="menu-text">操作记录</span>
                <span class="menu-arrow">›</span>
            </div>
        </div>

        <!-- 系统设置 -->
        <div class="menu-section">
            <div class="menu-item">
                <div class="menu-icon" style="background: #f3e5f5;">🔔</div>
                <span class="menu-text">消息通知</span>
                <span class="menu-badge">12</span>
                <span class="menu-arrow">›</span>
            </div>
            <div class="menu-item">
                <div class="menu-icon" style="background: #e0f2f1;">🔒</div>
                <span class="menu-text">账号安全</span>
                <span class="menu-arrow">›</span>
            </div>
            <div class="menu-item">
                <div class="menu-icon" style="background: #fff8e1;">❓</div>
                <span class="menu-text">帮助中心</span>
                <span class="menu-arrow">›</span>
            </div>
            <div class="menu-item">
                <div class="menu-icon" style="background: #fce4ec;">💬</div>
                <span class="menu-text">意见反馈</span>
                <span class="menu-arrow">›</span>
            </div>
        </div>

        <!-- 关于 -->
        <div class="menu-section">
            <div class="menu-item">
                <div class="menu-icon" style="background: #e8eaf6;">ℹ️</div>
                <span class="menu-text">关于我们</span>
                <span class="menu-arrow">›</span>
            </div>
            <div class="menu-item">
                <div class="menu-icon" style="background: #efebe9;">🔄</div>
                <span class="menu-text">检查更新</span>
                <span style="font-size: 12px; color: #999; margin-right: 8px;">v1.0.0</span>
                <span class="menu-arrow">›</span>
            </div>
        </div>

        <!-- 退出登录 -->
        <button class="btn btn-secondary btn-block" style="margin-top: 20px; padding: 14px;" onclick="showConfirm('确定要退出登录吗?', () => showToast('已退出登录'))">退出登录</button>

        <div style="text-align: center; padding: 20px; color: #ccc; font-size: 12px;">
            进销存管理系统 v1.0.0
        </div>
    </main>

    <!-- 底部导航 -->
    <nav class="bottom-nav"></nav>

    <script src="js/mobile.js"></script>
</body>
</html>
